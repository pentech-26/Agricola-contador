<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Contador de Agricola</title>
<meta name="description" content="Contador de puntuación para Agricola. Herramienta no oficial de PenTech.">
<meta name="theme-color" content="#35603a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Agricola">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preload" href="splash.webp" as="image">
<link rel="preload" href="fonts/grenze-gotisch.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Grenze Gotisch";src:url(fonts/grenze-gotisch.woff2) format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:"Bitter";src:url(fonts/bitter.woff2) format("woff2");font-weight:100 900;font-display:swap}

:root{
  --suelo:#35603a; --suelo2:#2b5030; --papel:#f2ecc9; --papel2:#e4daa9;
  --tinta:#33241a; --tinta2:#6b5540; --granero:#a3312a; --trigo:#e0ad2f;
  --linea:rgba(51,36,26,.2); --pos:#2c6a31; --neg:#a3312a; --sobre:#f6f1d6;
  --sombra:0 3px 0 rgba(20,30,15,.35);
  --tit:"Grenze Gotisch","Bitter",Georgia,serif; --txt:"Bitter",Georgia,serif;
}
:root[data-tema="noche"]{
  --suelo:#13221a; --suelo2:#0e1a14; --papel:#1f3329; --papel2:#2a4334;
  --tinta:#efe6c0; --tinta2:#b5ae8c; --granero:#c9483a; --trigo:#f0b64a;
  --linea:rgba(239,230,192,.18); --pos:#93d48d; --neg:#ff9382; --sobre:#efe6c0;
  --sombra:0 3px 0 rgba(0,0,0,.5);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  font-family:var(--txt);color:var(--tinta);font-size:16px;line-height:1.35;
  background:var(--suelo) repeating-linear-gradient(100deg,transparent 0 22px,rgba(0,0,0,.07) 22px 26px);
  touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  overscroll-behavior:none;font-variant-numeric:lining-nums tabular-nums;
}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation}
input{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--trigo);outline-offset:2px}
.oculto{display:none!important}

/* ---------- pantallas ---------- */
.pantalla{display:none;min-height:100%;max-width:520px;margin:0 auto;padding:0 14px calc(24px + env(safe-area-inset-bottom))}
.pantalla.activa{display:block}
.cab{display:flex;align-items:center;justify-content:space-between;max-width:520px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 14px 0}
.cab .lado{display:flex;gap:8px}
.redondo{width:42px;height:42px;border-radius:50%;background:var(--papel);color:var(--tinta);display:grid;place-items:center;box-shadow:var(--sombra)}
.redondo svg{width:22px;height:22px}
.redondo:active{transform:translateY(2px);box-shadow:none}
h1.titulo{font-family:var(--tit);font-weight:700;font-size:54px;line-height:.9;margin:6px 0 0;text-align:center;color:var(--sobre);letter-spacing:.01em;text-shadow:0 3px 0 rgba(0,0,0,.28)}
.subtitulo{font-family:var(--tit);font-weight:500;text-align:center;color:var(--trigo);font-size:22px;margin:0 0 14px}
.hoja-papel{background:var(--papel);border-radius:14px;padding:16px;box-shadow:var(--sombra);margin-bottom:14px}
h2{font-family:var(--tit);font-weight:600;font-size:28px;line-height:1;margin:0 0 10px}
p{margin:0 0 10px}
.ayuda{color:var(--tinta2);font-size:14.5px}
.boton{display:block;width:100%;padding:14px 16px;border-radius:12px;font-weight:700;font-size:17px;text-align:center;background:var(--granero);color:#fff5dc;box-shadow:0 4px 0 rgba(60,12,8,.55)}
.boton:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(60,12,8,.55)}
.boton.trigo{background:var(--trigo);color:#33241a;box-shadow:0 4px 0 rgba(110,78,8,.6)}
.boton.liso{background:transparent;color:var(--tinta);box-shadow:inset 0 0 0 2px var(--linea)}
.boton.sobre-suelo{background:transparent;color:var(--sobre);box-shadow:inset 0 0 0 2px rgba(246,241,214,.45)}
.boton[disabled]{opacity:.45}
.fila-botones{display:grid;gap:10px}
.aviso{background:rgba(224,173,47,.22);border:1.5px solid var(--trigo);border-radius:10px;padding:9px 12px;font-weight:600;font-size:14.5px;text-align:center;margin-bottom:12px;color:var(--sobre)}

/* ---------- entrada ---------- */
#entrada{position:fixed;inset:0;z-index:50;background:#5b9bd8;overflow:hidden;display:none}
#entrada.activa{display:block}
#entrada img.paisaje{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:42% 100%}
.ent-texto{position:absolute;left:0;right:0;top:calc(11% + env(safe-area-inset-top));text-align:center;padding:0 10px}
.ent-texto h1{font-family:var(--tit);font-weight:800;font-size:clamp(64px,23vw,118px);line-height:.85;margin:0;color:#fff3cf;text-shadow:0 4px 0 #4a2413,0 0 18px rgba(40,20,8,.45);-webkit-text-stroke:2px #4a2413;paint-order:stroke fill}
.ent-palabra{display:flex;align-items:center;justify-content:center;gap:12px;font-family:var(--tit);font-weight:600;font-size:clamp(24px,7.5vw,34px);color:#fff3cf;margin-top:10px;text-shadow:0 2px 0 #4a2413,0 0 10px rgba(40,20,8,.6)}
.ent-palabra::before,.ent-palabra::after{content:"";width:34px;height:3px;border-radius:2px;background:#fff3cf;box-shadow:0 2px 0 #4a2413}
.ent-toca{position:absolute;left:50%;bottom:calc(7% + env(safe-area-inset-bottom));transform:translateX(-50%);white-space:nowrap;padding:14px 26px;border-radius:999px;background:#a3312a;color:#fff5dc;font-weight:700;font-size:18px;border:2px solid #f0c95a;box-shadow:0 5px 0 rgba(60,12,8,.7),0 0 0 4px rgba(40,20,8,.25);animation:late 1.8s ease-in-out infinite}
@keyframes late{50%{transform:translateX(-50%) scale(1.05)}}

/* ---------- acceso ---------- */
.campo-clave{width:100%;padding:13px 12px;border-radius:10px;border:2px solid var(--linea);background:rgba(255,255,255,.35);font-size:19px;font-weight:700;text-align:center;letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px;-webkit-user-select:text;user-select:text}
:root[data-tema="noche"] .campo-clave{background:rgba(0,0,0,.25)}
.campo-clave::placeholder{letter-spacing:0;text-transform:none;font-weight:500;color:var(--tinta2);opacity:.8}

/* ---------- inicio ---------- */
.linea-ajuste{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0}
.linea-ajuste b{font-size:17px}
.paso-grupo{display:flex;align-items:center;gap:4px}
.paso{width:40px;height:40px;border-radius:10px;font-size:26px;font-weight:800;line-height:1;display:grid;place-items:center;color:#fff1d2;text-shadow:0 1px 0 rgba(50,22,6,.8);
  background:
    repeating-linear-gradient(92deg,rgba(255,255,255,0) 0 5px,rgba(255,226,170,.10) 5px 6px,rgba(255,255,255,0) 6px 11px,rgba(60,25,5,.16) 11px 12px),
    radial-gradient(ellipse 9px 3px at 30% 68%,rgba(70,30,8,.45),transparent 80%),
    linear-gradient(180deg,#b67a43 0%,#9a5f2e 55%,#82491f 100%);
  border:1.5px solid #5e3315;box-shadow:inset 0 1px 0 rgba(255,220,160,.45),0 3px 0 #4a250c}
.paso:active{transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,220,160,.3),0 1px 0 #4a250c}
.paso[disabled]{opacity:.5;filter:saturate(.55)}
.valor{min-width:38px;text-align:center;font-weight:800;font-size:21px}
.jug-lista{display:grid;gap:8px;margin:8px 0 4px}
.jug-fila{display:flex;align-items:center;gap:10px}
.ficha{width:38px;height:38px;border-radius:50%;flex:none;border:3px solid rgba(0,0,0,.28);box-shadow:inset 0 -4px 0 rgba(0,0,0,.18)}
.jug-fila input{flex:1;min-width:0;padding:10px 12px;border-radius:10px;border:2px solid var(--linea);background:rgba(255,255,255,.35);font-size:17px;font-weight:600;-webkit-user-select:text;user-select:text}
:root[data-tema="noche"] .jug-fila input{background:rgba(0,0,0,.25)}
.interruptor{position:relative;width:56px;height:32px;border-radius:999px;background:var(--papel2);box-shadow:inset 0 0 0 2px var(--linea);flex:none;transition:background .2s}
.interruptor::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:var(--tinta2);transition:transform .2s}
.interruptor[aria-checked="true"]{background:var(--pos)}
.interruptor[aria-checked="true"]::after{transform:translateX(24px);background:#fff5dc}
.pie{text-align:center;margin-top:18px}
.pie button{color:var(--sobre);opacity:.85;font-size:13.5px;text-decoration:underline;text-underline-offset:3px;padding:8px}

/* ---------- hoja de puntuación ---------- */
#hoja{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
.hoja-cab{position:sticky;top:0;z-index:5;margin:0 -14px;padding:calc(8px + env(safe-area-inset-top)) 14px 10px;background:var(--suelo2);box-shadow:0 3px 0 rgba(0,0,0,.25)}
.hoja-barra{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;margin-bottom:10px}
.hoja-barra .lado{display:flex;gap:8px}
.hoja-barra .redondo{width:38px;height:38px}
.hoja-logo{font-family:var(--tit);font-weight:800;font-size:36px;line-height:1;text-align:center;color:var(--sobre);text-shadow:0 2px 0 rgba(0,0,0,.35)}
.pestanas{display:flex;gap:5px}
.pestana{flex:1;min-width:0;border-radius:10px 10px 4px 4px;background:var(--papel2);padding:0 4px 6px;opacity:.72;overflow:hidden;border-top:7px solid var(--jug)}
.pestana[aria-selected="true"]{opacity:1;background:var(--papel);box-shadow:var(--sombra)}
.pestana span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px;font-weight:600;padding-top:4px}
.pestana strong{display:block;font-family:var(--tit);font-weight:700;font-size:25px;line-height:1}
.rotulo{display:flex;flex-direction:column;align-items:center;gap:0;color:var(--sobre);font-size:13.5px;margin:10px 0 8px;text-align:center}
.rotulo button{text-decoration:underline;text-underline-offset:3px;padding:6px 0}
#rotuloTxt{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.85}
#rotuloTxt:empty{display:none}
.filas{background:var(--papel);border-radius:14px;box-shadow:var(--sombra),0 0 0 1px rgba(0,0,0,.25);padding:2px 10px;border:5px solid var(--jug);transition:border-color .25s}
.fila{display:grid;grid-template-columns:44px minmax(0,1fr) auto 42px;align-items:center;gap:8px;padding:9px 0;border-bottom:1.5px dashed var(--linea)}
.fila:last-child{border-bottom:0}
.fila .ico{grid-row:span 2;align-self:center;width:44px;height:44px;object-fit:contain;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}
.fila .nom{font-weight:700;font-size:15.5px;line-height:1.15}
.fila .regla{color:var(--tinta2);font-size:12px;line-height:1.2;margin-top:2px}
.tramos{display:flex;gap:3px}
.fila.ancha{row-gap:5px}
.fila .bajo{grid-column:2 / 5}
.fila:not(.ancha) .ico{grid-row:auto}
@media (max-width:380px){.fila{grid-template-columns:38px minmax(0,1fr) auto 38px;gap:6px}.fila .ico{width:38px;height:38px}.fila .paso{width:34px}.disco{width:38px;height:38px;font-size:21px}}
.tramos i{flex:1;font-style:normal;text-align:center;font-size:10.5px;font-weight:600;padding:2px 0;border-radius:4px;background:var(--papel2);color:var(--tinta2);white-space:nowrap}
.tramos i.on{background:var(--tinta);color:var(--papel)}
.fila .paso{width:36px;height:38px}
.fila .valor{min-width:30px;font-size:20px}
.disco{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-family:var(--tit);font-weight:700;font-size:23px;background:var(--trigo);color:#33241a;box-shadow:inset 0 -4px 0 rgba(0,0,0,.2)}
.disco.neg{background:var(--granero);color:#fff5dc}
.disco.cero{background:var(--papel2);color:var(--tinta2)}
.segmento{display:flex;gap:3px}
.segmento button{flex:1;font-size:11.5px;font-weight:700;padding:5px 2px;border-radius:5px;background:var(--papel2);color:var(--tinta2)}
.segmento button[aria-pressed="true"]{background:var(--tinta);color:var(--papel)}
.barra{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--suelo2);padding:10px 14px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -3px 0 rgba(0,0,0,.25)}
.barra div{max-width:492px;margin:0 auto;display:flex;align-items:center;gap:14px}
.barra .boton{flex:1}

/* ---------- podio ---------- */
.corona{text-align:center;color:var(--sobre);margin:14px 0 14px}
.corona h2{font-size:44px;color:var(--trigo);margin:0}
.puesto{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1.5px dashed var(--linea)}
.puesto:last-of-type{border-bottom:0}
.puesto .pos{font-family:var(--tit);font-weight:700;font-size:26px;width:38px;text-align:center}
.puesto .ficha{width:28px;height:28px}
.puesto .n{flex:1;min-width:0;font-weight:700;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.puesto .t{font-family:var(--tit);font-weight:700;font-size:32px}
.puesto.primero .n,.puesto.primero .t{color:var(--pos)}
table.desglose{width:100%;border-collapse:collapse;font-size:13px}
table.desglose th,table.desglose td{padding:5px 3px;text-align:center;border-bottom:1px solid var(--linea)}
table.desglose th:first-child,table.desglose td:first-child{text-align:left;font-weight:600}
table.desglose thead th{font-size:12px;vertical-align:bottom}
table.desglose .punto{display:block;width:14px;height:14px;border-radius:50%;margin:0 auto 3px;border:2px solid rgba(0,0,0,.25)}
table.desglose tfoot td{font-weight:800;font-size:15px;border-bottom:0}
table.desglose td.m{color:var(--neg);font-weight:700}

/* ---------- ventanas ---------- */
.velo{position:fixed;inset:0;z-index:60;background:rgba(10,18,10,.62);display:none;align-items:flex-end;justify-content:center}
.velo.abierto{display:flex}
.ventana{width:100%;max-width:520px;max-height:88%;overflow:auto;background:var(--papel);border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));animation:sube .22s ease-out}
@keyframes sube{from{transform:translateY(30px);opacity:0}}
.ventana .cierra{float:right;width:38px;height:38px;border-radius:50%;background:var(--papel2);font-size:22px;line-height:1}
.ventana .legal{font-size:14.5px;-webkit-user-select:text;user-select:text}
.idiomas{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.idiomas button{padding:13px;border-radius:10px;background:var(--papel2);font-weight:700}
.idiomas button[aria-pressed="true"]{background:var(--tinta);color:var(--papel)}
.partida{border:1.5px solid var(--linea);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.partida .fecha{font-size:12.5px;color:var(--tinta2)}
.partida .res{font-weight:700;margin:3px 0 6px}
.partida .acc{display:flex;gap:8px}
.partida .acc button{flex:1;padding:8px;border-radius:8px;background:var(--papel2);font-weight:700;font-size:14px}
.partida .acc button.rojo{background:var(--granero);color:#fff5dc}
.etiq{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--pos);color:var(--papel);margin-left:6px;vertical-align:1px}
.tostada{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:80;background:var(--tinta);color:var(--papel);padding:10px 16px;border-radius:999px;font-weight:700;font-size:14.5px;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90%;text-align:center}
.tostada.ver{opacity:1}
#confeti{position:fixed;inset:0;z-index:70;pointer-events:none}
#gira{position:fixed;inset:0;z-index:90;background:var(--suelo2);color:var(--sobre);display:none;place-items:center;font-family:var(--tit);font-size:34px}
@media (orientation:landscape) and (max-height:520px) and (pointer:coarse){#gira{display:grid}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- ============ ENTRADA ============ -->
<section id="entrada" class="activa" role="button" tabindex="0" aria-label="Agricola">
  <img class="paisaje" src="splash.webp" alt="">
  <div class="ent-texto">
    <h1>Agricola</h1>
    <div class="ent-palabra" data-i="splashWord">Contador</div>
  </div>
  <div class="ent-toca" data-i="toca">Toca para empezar</div>
</section>

<!-- ============ CABECERA ============ -->
<header class="cab oculto" id="cab">
  <div class="lado">
    <button class="redondo btnIdioma" id="btnIdioma" aria-label="Idioma"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/></svg></button>
  </div>
  <div class="lado">
    <button class="redondo btnTema" id="btnTema" aria-label="Tema"></button>
    <button class="redondo" id="btnArchivo" aria-label="Archivo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M5 4h11l3 3v13H5z"/><path d="M8 10h8M8 14h8M8 18h5"/></svg></button>
  </div>
</header>

<!-- ============ ACCESO ============ -->
<section class="pantalla" id="acceso">
  <h1 class="titulo">Agricola</h1>
  <p class="subtitulo" data-i="splashWord">Contador</p>
  <div class="hoja-papel">
    <h2 data-i="accesoTit">Clave de licencia</h2>
    <p class="ayuda" data-i="introClave"></p>
    <input class="campo-clave" id="inClave" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="24">
    <div class="fila-botones">
      <button class="boton" id="btnActivar" data-i="activar">Activar</button>
      <button class="boton trigo" id="btnComprar" data-i="comprar">Comprar la clave</button>
    </div>
  </div>
  <div class="hoja-papel">
    <p id="txtPrueba" style="font-weight:600"></p>
    <button class="boton liso" id="btnProbar" data-i="probar">Probar gratis</button>
  </div>
  <div class="pie"><button class="abreLegal"></button></div>
</section>

<!-- ============ INICIO ============ -->
<section class="pantalla" id="inicio">
  <h1 class="titulo">Agricola</h1>
  <p class="subtitulo" data-i="splashWord">Contador</p>
  <div class="aviso oculto" id="avisoPrueba"></div>
  <button class="boton trigo oculto" id="btnContinuar" style="margin-bottom:14px" data-i="continuar">Continuar partida</button>
  <div class="hoja-papel">
    <h2 data-i="nuevaPartida">Nueva partida</h2>
    <div class="linea-ajuste">
      <b data-i="jugadores">Jugadores</b>
      <div class="paso-grupo"><button class="paso" id="menosJ" aria-label="−">−</button><span class="valor" id="numJ">2</span><button class="paso" id="masJ" aria-label="+">+</button></div>
    </div>
    <div class="jug-lista" id="jugLista"></div>
    <p class="ayuda" data-i="ayudaColor" style="margin-top:8px"></p>
  </div>
  <div class="hoja-papel">
    <div class="linea-ajuste">
      <div><b data-i="moor">Bosques y Cenagales</b><div class="ayuda" data-i="moorSub"></div></div>
      <button class="interruptor" id="swMoor" role="switch" aria-checked="false" data-ia="moor"></button>
    </div>
  </div>
  <button class="boton" id="btnEmpezar" data-i="empezar">Empezar partida</button>
  <div class="pie"><button class="abreLegal"></button></div>
</section>

<!-- ============ HOJA ============ -->
<section class="pantalla" id="hoja">
  <div class="hoja-cab">
    <div class="hoja-barra">
      <button class="redondo" id="btnSalir" data-ia="inicioLbl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>

function puntos(id, v){
  const f = FILAS.find(x => x.id === id), n = v[id];

    case 'sinusar':  return -n;
    case 'establos': return n;

    case 'enf':      return -2 * n;          // en cama: 1 punto en vez de 3
    case 'mend':     return -3 * n;

const IDIOMAS = ['es','ca','en','fr','de','it'];

  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- sonido (Web Audio, sin archivos) ---------- */
let actx;
function audio(){ try{ actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); }catch(e){} return actx; }
function nota(f, cuando, dur, vol){
  const a = audio(); if (!a) return;
  const t0 = a.currentTime + cuando, g = a.createGain();
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  g.connect(a.destination);
  [['triangle',1,1],['sine',2,.35]].forEach(([tipo,m,v]) => {
    const o = a.createOscillator(), gg = a.createGain(); o.type = tipo; o.frequency.value = f * m; gg.gain.value = v;
    o.connect(gg); gg.connect(g); o.start(t0); o.stop(t0 + dur + 0.05);
  });
}
const N = {D4:293.66,E4:329.63,F4:349.23,G4:392,A4:440,Bb4:466.16,C5:523.25,D5:587.33,E5:659.26,F5:698.46,A3:220,D3:146.83,G3:196};
function melodia(){   // danza campesina original, en re
  const c = 0.21, tema = [['D4',1],['F4',1],['A4',1],['D5',2],['C5',1],['A4',1],['Bb4',1],['A4',1],['G4',2],['F4',1],['E4',1],['G4',1],['F4',1],['D4',3]];
  let x = 0; tema.forEach(([n,d]) => { nota(N[n], x, d*c + .5, .22); x += d*c; });
  [['D3',0],['G3',6*c],['A3',12*c],['D3',15*c]].forEach(([n,cu]) => nota(N[n], cu, 1.3, .16));
}
function fanfarria(){ ['D4','F4','A4','D5','F5'].forEach((n,i) => nota(N[n], i*.11, .9, .2)); nota(N.D3, 0, 1.4, .16); }
function clic(){ nota(880, 0, .08, .05); }

/* ---------- navegación ---------- */

}

/* ---------- licencia ---------- */

const enPrueba = () => !conLicencia();
const pruebasRestantes = () => Math.max(0, LICENCIA.partidasPrueba - ls.get(LS.usadas, 0));

}

}

/* ---------- inicio ---------- */
function colorLibre(desde){
  for (let i = 1; i <= 6; i++){ const c = (desde + i) % 6; if (!ajuste.jug.some(j => j.color === c)) return c; }
  return desde;
}

}

});

$('#jugLista').addEventListener('keydown', e => { if (e.key === 'Enter') e.target.blur(); });
$('#menosJ').onclick = () => { if (ajuste.jug.length > 1){ ajuste.jug.pop(); clic(); pintaInicio(); } };
$('#masJ').onclick = () => { if (ajuste.jug.length < 6){ ajuste.jug.push({nombre:'', color:colorLibre(ajuste.jug[ajuste.jug.length-1].color)}); clic(); pintaInicio(); } };
$('#swMoor').onclick = () => { ajuste.moor = !ajuste.moor; clic(); pintaInicio(); };
$('#btnContinuar').onclick = () => { clic(); ir(partida && partida.terminada ? 'podio' : 'hoja'); };

let avisoCurso = 0;
function empezar(jugadores, moor){
  if (enPrueba()){
    if (pruebasRestantes() <= 0){ modoPrueba = false; ir('acceso'); return false; }
    ls.set(LS.usadas, ls.get(LS.usadas, 0) + 1);
  }
  partida = {id: Date.now(), fecha: new Date().toISOString(), moor: !!moor, act: 0, terminada: false,
             jug: jugadores.map(j => ({nombre: j.nombre, color: j.color, v: VALORES0()}))};
  guarda(); ir('hoja'); return true;
}
$('#btnEmpezar').onclick = () => {
  if (partida && !partida.terminada && Date.now() - avisoCurso > 4000){ avisoCurso = Date.now(); toast(t('enCurso')); return; }
  ls.set(LS.ultimos, {jug: ajuste.jug, moor: ajuste.moor});
  clic(); empezar(ajuste.jug, ajuste.moor);
};
function guarda(){ if (partida) ls.set(LS.partida, partida); else ls.del(LS.partida); }

/* ---------- hoja de puntuación ---------- */
function etiquetasTramo(th){
  const lim = [0, ...th];
  return lim.map((a,i) => { const b = i < th.length ? th[i] - 1 : null; return b === null ? a + '+' : a === b ? String(a) : a + '-' + b; });
}
function pintaHoja(){
  if (!partida){ ir('inicio'); return; }
  const P = partida;
  $('#pestanas').innerHTML = P.jug.map((j,i) =>
    `<button class="pestana" role="tab" data-j="${i}" aria-selected="${i === P.act}" style="--jug:${COLORES[j.color]}"><span>${esc(nomJug(j))}</span><strong>${num(total(j.v, P.moor))}</strong></button>`).join('');
  const j = P.jug[P.act];
  $('#rotuloTxt').textContent = P.moor ? t('moor') : '';
  $('#filas').style.setProperty('--jug', COLORES[j.color]);
  $('#filas').innerHTML = filasActivas(P.moor).map(f => {
    let bajo;
    if (f.th) bajo = `<div class="tramos" data-tr="${f.id}">${etiquetasTramo(f.th).map(e => `<i>${e}</i>`).join('')}</div>`;
    else if (f.casa) bajo = `<div class="segmento">${T[idioma].mat.map((m,k) => `<button data-mat="${k}" aria-pressed="false">${esc(m)}</button>`).join('')}</div>`;
    else bajo = `<div class="regla">${esc(t(f.r))}</div>`;
    const ancho = f.th || f.casa;   // tramos y material ocupan toda la fila de abajo
    return `<div class="fila${ancho ? ' ancha' : ''}" data-f="${f.id}">${ICO[f.id]}<div class="txt"><div class="nom">${esc(nomFila(f.id))}</div>${ancho ? '' : bajo}</div>
      <div class="paso-grupo"><button class="paso" data-d="-1" aria-label="${esc(nomFila(f.id))} −">−</button><span class="valor"></span><button class="paso" data-d="1" aria-label="${esc(nomFila(f.id))} +">+</button></div>
      <span class="disco"></span>${ancho ? `<div class="bajo">${bajo}</div>` : ''}</div>`;
  }).join('');
  filasActivas(P.moor).forEach(f => refresca(f.id));
  refrescaTotales();
}
function limites(f, v){ return {min: f.min || 0, max: f.id === 'enf' ? v.fam : f.max}; }
function refresca(id){
  const P = partida, v = P.jug[P.act].v, f = FILAS.find(x => x.id === id), el = $(`.fila[data-f="${id}"]`);
  if (!el) return;
  const p = puntos(id, v), {min, max} = limites(f, v);
  el.querySelector('.valor').textContent = num(v[id]);
  const d = el.querySelector('.disco'); d.textContent = signo(p); d.className = 'disco' + (p < 0 ? ' neg' : p === 0 ? ' cero' : '');
  el.querySelector('[data-d="-1"]').disabled = v[id] <= min; el.querySelector('[data-d="1"]').disabled = v[id] >= max;
  if (f.th){ const k = tramo(v[id], f.th); el.querySelectorAll('.tramos i').forEach((x,i) => x.classList.toggle('on', i === k)); }
  if (f.casa) el.querySelectorAll('[data-mat]').forEach(b => b.setAttribute('aria-pressed', +b.dataset.mat === v.mat));
}
function refrescaTotales(){
  const P = partida;
  P.jug.forEach((j,i) => { const b = $(`.pestana[data-j="${i}"] strong`); if (b) b.textContent = num(total(j.v, P.moor)); });
}
function cambia(id, d){
  const P = partida, v = P.jug[P.act].v, f = FILAS.find(x => x.id === id), {min, max} = limites(f, v);
  const n = Math.min(max, Math.max(min, v[id] + d)); if (n === v[id]) return false;
  v[id] = n;
  if (id === 'fam' && v.enf > v.fam){ v.enf = v.fam; }
  refresca(id); if (id === 'fam' && P.moor) refresca('enf');
  refrescaTotales(); guarda(); return true;
}
/* pulsación mantenida: repite */
let rep, repT;
function paraRep(){ clearTimeout(repT); clearInterval(rep); }
$('#filas').addEventListener('pointerdown', e => {
  const b = e.target.closest('.paso'); if (!b || b.disabled) return;
  const id = b.closest('.fila').dataset.f, d = +b.dataset.d;
  paraRep(); if (cambia(id, d)) clic();
  repT = setTimeout(() => { rep = setInterval(() => { if (!cambia(id, d)) paraRep(); }, 85); }, 420);
});
['pointerup','pointercancel','pointerleave'].forEach(ev => $('#filas').addEventListener(ev, paraRep));
window.addEventListener('blur', paraRep);
$('#filas').addEventListener('keydown', e => {   // teclado
  const b = e.target.closest('.paso'); if (b && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); cambia(b.closest('.fila').dataset.f, +b.dataset.d); }

/* ---------- final de partida ---------- */
function resumen(P){   // datos que se guardan en el archivo
  return {id: P.id, fecha: P.fecha, moor: P.moor,
    jug: P.jug.map(j => { const pts = {}; filasActivas(P.moor).forEach(f => pts[f.id] = puntos(f.id, j.v));
      return {nombre: j.nombre, color: j.color, total: total(j.v, P.moor), pts}; })};
}
function clasifica(jug){
  const o = jug.map((j,i) => ({...j, i})).sort((a,b) => b.total - a.total);
  o.forEach((j,k) => { j.pos = k > 0 && o[k-1].total === j.total ? o[k-1].pos : k + 1; });
  return o;
}
function tablaDesglose(R){
  const fs = filasActivas(R.moor).filter(f => R.jug[0].pts[f.id] !== undefined);
  return `<table class="desglose"><thead><tr><th></th>${R.jug.map(j => `<th><span class="punto" style="background:${COLORES[j.color]}"></span>${esc(nomJug(j).slice(0,6))}</th>`).join('')}</tr></thead>
    <tbody>${fs.map(f => `<tr><td>${esc(nomFila(f.id))}</td>${R.jug.map(j => `<td class="${j.pts[f.id] < 0 ? 'm' : ''}">${num(j.pts[f.id])}</td>`).join('')}</tr>`).join('')}</tbody>
    <tfoot><tr><td>${esc(t('total'))}</td>${R.jug.map(j => `<td>${num(j.total)}</td>`).join('')}</tr></tfoot></table>`;
}
function terminar(){
  const R = resumen(partida);
  const h = ls.get(LS.hist, []).filter(x => x.id !== R.id); h.unshift(R); ls.set(LS.hist, h.slice(0, MAX_HIST));
  partida.terminada = true; guarda();
  ir('podio'); fanfarria(); confeti();
}
$('#btnTerminar').onclick = terminar;
$('#btnSalir').onclick = () => { clic(); ir('inicio'); };
function pintaPodio(){
  if (!partida){ ir('inicio'); return; }
  const R = resumen(partida), o = clasifica(R.jug), primeros = o.filter(j => j.pos === 1);
  const uno = R.jug.length === 1;
  $('#podioTit').textContent = uno ? t('granjaLista') : primeros.length > 1 ? t('empate') : t('gana', nomJug(primeros[0]));
  $('#podioSub').textContent = uno ? t('puntosDe', num(o[0].total)) : primeros.length > 1 ? t('notaEmpate') : t('puntosDe', num(primeros[0].total));
  $('#podioLista').innerHTML = o.map(j => `<div class="puesto${j.pos === 1 ? ' primero' : ''}"><span class="pos">${j.pos}.</span><span class="ficha" style="background:${COLORES[j.color]}"></span><span class="n">${esc(nomJug(j))}</span><span class="t">${num(j.total)}</span></div>`).join('');
  $('#podioTabla').innerHTML = tablaDesglose(R);
}
$('#btnVolver').onclick = () => { partida.terminada = false; guarda(); clic(); ir('hoja'); };
$('#btnRevancha').onclick = () => { clic(); empezar(partida.jug, partida.moor); };

document.addEventListener('keydown', e => { if (e.key === 'Escape') cierra(); });

document.addEventListener('click', e => { if (e.target.closest('.abreLegal')) abre(`<h2>${esc(t('avisoLegal'))}</h2><p class="legal">${esc(t('legal'))}</p><p class="legal ayuda">${esc(t('app'))} · ${VERSION}</p>`); });

const abreIdioma = () => abre(`<h2>${esc(t('idioma'))}</h2><div class="idiomas">${IDIOMAS.map(c => `<button data-idioma="${c}" aria-pressed="${c === idioma}">${T[c].nombreIdioma}</button>`).join('')}</div>`);
$$('.btnIdioma').forEach(b => b.onclick = abreIdioma);
$('#ventana').addEventListener('click', e => {
  const b = e.target.closest('[data-idioma]'); if (b){ idioma = b.dataset.idioma; ls.set(LS.idioma, idioma); cierra(); aplicaIdioma(); return; }
  const v = e.target.closest('[data-ver]'); if (v){ const d = $(`#det-${v.dataset.ver}`); const abierto = d.classList.toggle('oculto'); v.textContent = abierto ? t('ver') : t('ocultar'); return; }
  const x = e.target.closest('[data-borra]'); if (x){ dobleToque(x, () => { ls.set(LS.hist, ls.get(LS.hist, []).filter(p => String(p.id) !== x.dataset.borra)); toast(t('borrada')); abreArchivo(); }); return; }
  const z = e.target.closest('[data-vacia]'); if (z){ dobleToque(z, () => { ls.set(LS.hist, []); toast(t('vaciado')); abreArchivo(); }); }
});
function dobleToque(b, hacer){
  if (b.dataset.listo){ hacer(); return; }
  b.dataset.listo = '1'; const antes = b.textContent; b.textContent = t('otraVez'); b.classList.add('rojo');
  setTimeout(() => { if (b.isConnected){ delete b.dataset.listo; b.textContent = antes; b.classList.remove('rojo'); } }, 3000);
}

$('#btnTabla').onclick = () => {
  const P = partida, cab = ['−1','1','2','3','4'];
  const filas = FILAS.filter(f => f.th).map(f => `<tr><td>${esc(nomFila(f.id))}</td>${etiquetasTramo(f.th).map(e => `<td>${e}</td>`).join('')}</tr>`).join('');
  const otras = FILAS.filter(f => !f.th && (!f.moor || P.moor)).map(f => `<tr><td>${esc(nomFila(f.id))}</td><td style="text-align:left">${esc(t(f.casa ? 'rCasa' : f.r))}</td></tr>`).join('');
  abre(`<h2>${esc(t('tabla'))}</h2>
    <table class="desglose"><thead><tr><th>${esc(t('ptsCada'))}</th>${cab.map(c => `<th style="font-size:15px">${c}</th>`).join('')}</tr></thead><tbody>${filas}</tbody></table>
    <table class="desglose" style="margin-top:14px"><tbody>${otras}</tbody></table>
    <p class="ayuda" style="margin-top:12px">${esc(t('notaEmpate'))}</p>`);
};

function abreArchivo(){
  const h = ls.get(LS.hist, []);
  const fmt = new Intl.DateTimeFormat(idioma, {day:'numeric', month:'long', year:'numeric', hour:'2-digit', minute:'2-digit'});
  const cuerpo = h.length ? h.map(R => {
    const o = clasifica(R.jug), gan = o.filter(j => j.pos === 1);
    const res = R.jug.length === 1 ? `${esc(nomJug(o[0]))}: ${num(o[0].total)}` : o.map(j => `${j.pos}. ${esc(nomJug(j))} ${num(j.total)}`).join(' · ');
    return `<div class="partida"><div class="fecha">${esc(fmt.format(new Date(R.fecha)))}${R.moor ? `<span class="etiq">${esc(t('moor'))}</span>` : ''}${R.jug.length === 1 ? `<span class="etiq">${esc(t('solo'))}</span>` : gan.length > 1 ? `<span class="etiq">${esc(t('empate'))}</span>` : ''}</div>
      <div class="res">${res}</div>
      <div class="oculto" id="det-${R.id}" style="margin-bottom:8px">${tablaDesglose(R)}</div>
      <div class="acc"><button data-ver="${R.id}">${esc(t('ver'))}</button><button data-borra="${R.id}">${esc(t('borrar'))}</button></div></div>`;
  }).join('') + `<button class="boton liso" data-vacia>${esc(t('vaciar'))}</button>` : `<p class="ayuda">${esc(t('vacio'))}</p>`;
  abre(`<h2>${esc(t('archivo'))}</h2>${cuerpo}`);
}
$('#btnArchivo').onclick = abreArchivo;

/* ---------- confeti ---------- */
function confeti(){
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = $('#confeti'), x = c.getContext('2d'), W = c.width = innerWidth, H = c.height = innerHeight;
  const col = ['#e0ad2f','#a3312a','#7fb25a','#fbf6e6','#2f62a8','#e8822a'];
  const ps = Array.from({length:130}, () => ({x:Math.random()*W, y:-20-Math.random()*H*.6, s:5+Math.random()*7, vy:2+Math.random()*3.5, vx:-1.2+Math.random()*2.4, r:Math.random()*6, vr:-.2+Math.random()*.4, c:col[Math.floor(Math.random()*col.length)]}));
  const fin = performance.now() + 3600;
  (function paso(ahora){
    x.clearRect(0,0,W,H);
    ps.forEach(p => { p.x += p.vx; p.y += p.vy; p.r += p.vr; x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.s/2,-p.s/3,p.s,p.s*.66); x.restore(); });
    if (ahora < fin) requestAnimationFrame(paso); else x.clearRect(0,0,W,H);
  })(performance.now());
}

/* ---------- sin zoom ni menús del navegador ---------- */
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());
document.addEventListener('contextmenu', e => { if (!e.target.closest('.legal, input')) e.preventDefault(); });

/* ---------- arranque ---------- */
aplicaIdioma();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js', {updateViaCache:'none'}).catch(() => {}));
}
</script>
